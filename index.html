<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek’s Archive</title>
<style>
:root{--bg:#2a0d17;--card:#3a1423;--line:#5b2a3c;--ink:#f6efe9;--ink2:#cfb3ba;--acc:#f0c9cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 20px 48px}
.top{display:flex;align-items:center;gap:16px}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;border:2px dashed var(--line);background:var(--card) center/cover no-repeat}.avatar.has{border:2px solid var(--acc)}
h1{margin:0;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(20px,6vw,34px);line-height:1.2}
.byline{margin:4px 0 0;font-size:13px;letter-spacing:.14em;color:var(--ink2);font-weight:600}
.college{margin:18px 0 0;font-size:15px;color:var(--acc);letter-spacing:.02em}
h2{font-size:18px;margin:26px 0 12px;color:var(--ink2);font-weight:500}
.grid{display:flex;flex-direction:column;gap:12px}
.box{width:100%;min-height:68px;padding:14px 18px;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center}
.box:hover{border-color:var(--acc)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:22px;font-size:14px;color:var(--ink2)}
.crumbs button{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:8px 2px;min-height:44px;text-decoration:underline}
.item{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 14px;margin-bottom:8px}
.btn{min-height:40px;padding:0 14px;border-radius:8px;background:var(--acc);color:#2a0d17;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.muted{color:var(--ink2)}
footer{margin-top:40px;color:var(--ink2);font-size:14px}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head>
<body><main>
<header><div class="top"><div class="avatar" id="avatar" role="img" aria-label="Photo of Malek (empty for now)"></div><div><h1>Malek’s Archive</h1><p class="byline">BY : MALEK HISHAM</p></div></div>
<p class="college">Al-Azhar Faculty of Medicine, Damietta</p></header>
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<section><h2 id="title"></h2><div id="view"></div></section>
<footer>Malek’s Archive</footer>
</main>
<script>
/* Add content: ITEMS["الفرقة الثانية/Semester 1/CVS/Physiology/Lecture 1 title/PDF by Malek"] = [{title:"Lecture 1", pdf:"pdfs/x.pdf"}]  (leave pdf out for a text-only entry) */
const MODULES = {"الفرقة الثانية/Semester 1":["CVS","Renal","Psychology"]};
const LECTURES = {}; /* Keys start with "الفرقة الثانية/Semester 1/": LECTURES["الفرقة الثانية/Semester 1/CVS/Physiology"] = [...]; Psychology: LECTURES["الفرقة الثانية/Semester 1/Psychology"] */
const ITEMS = {};
const CORE = ["Physiology","Anatomy","Embryology","Pharmacology","Pathology","Biochemistry","Histology","Microbiology"];
const TREE = {
  "CVS": [...CORE, "Practical"],
  "Renal": ["Physiology","Biochemistry","Pathology","Anatomy","Histology","Parasitology","Microbiology","Pharmacology","Practical"],
  "Psychology": null
};
const RES = ["PDF by Malek","College PDFs","College Lectures Explanation","External Lectures Explanation","Quiz"];
let path = [];
const $ = id => document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function go(p){path=p;render()}
function render(){
  const cr=$("crumbs");cr.replaceChildren();
  const parts=["Home",...path];
  parts.forEach((p,i)=>{
    if(i<parts.length-1){const b=el("button","",p);b.type="button";b.onclick=()=>go(path.slice(0,i));cr.append(b,el("span","","/"))}
    else if(i>0)cr.append(el("span","",p));
  });
  const v=$("view");v.replaceChildren();
  const YEARS=["الفرقة الأولى", "الفرقة الثانية", "الفرقة الثالثة", "الفرقة الرابعة", "الفرقة الخامسة"], SEMS=["Semester 1","Semester 2"];
  const p=path.slice(2), mod=p[0], ld=(mod&&TREE[mod])?2:1, n=p.length;
  let level;
  if(path.length===0){$("title").textContent="Choose a year";level=YEARS.map(y=>[y,()=>go([y])])}
  else if(path.length===1){$("title").textContent=path[0];level=SEMS.map(s=>[s,()=>go([path[0],s])])}
  else if(n===0){
    $("title").textContent=path[0]+" · "+path[1];
    const ms=MODULES[path.join("/")]||[];
    if(!ms.length){v.append(el("p","muted","No modules added yet."));return}
    level=ms.map(m=>[m,()=>go([...path,m])])}
  else if(n<ld){$("title").textContent=mod;level=TREE[mod].map(s=>[s,()=>go([...path,s])])}
  else if(n===ld){
    $("title").textContent=path[path.length-1]+" · Lectures";
    const ls=LECTURES[path.join("/")]||[];
    if(!ls.length){v.append(el("p","muted","No lectures added yet."));return}
    level=ls.map(l=>[l,()=>go([...path,l])])}
  else if(n===ld+1){$("title").textContent=path[path.length-1];level=RES.map(r=>[r,()=>go([...path,r])])}
  else{
    $("title").textContent=path[path.length-1];
    const items=ITEMS[path.join("/")]||[];
    if(!items.length)v.append(el("p","muted","Nothing added here yet."));
    items.forEach(i=>{const d=el("div","item");d.append(el("strong","",i.title));
      if(i.pdf){const a=el("a","btn","Open");a.href=i.pdf;a.target="_blank";a.rel="noopener";const b=el("a","btn alt","Download");b.href=i.pdf;b.download="";d.append(a,b)}
      v.append(d)});
    return;
  }
  const g=el("div","grid");level.forEach(([n,f])=>{const b=el("button","box",n);b.type="button";b.onclick=f;g.append(b)});v.append(g);
}
path=decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);render();
(function(){const i=new Image();i.onload=()=>{const a=$("avatar");a.style.backgroundImage="url(profile.jpg)";a.classList.add("has");a.setAttribute("aria-label","Photo of Malek")};i.src="profile.jpg";})();
</script></body></html>
